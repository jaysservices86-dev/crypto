[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "arbitrage-lattice"
version = "0.1.0"
description = "Compliance-first lead triage and fulfillment routing workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "openai",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "supabase",
]

[project.scripts]
arbitrage-lattice = "arbitrage_lattice.main:main"

[tool.setuptools.packages.find]
where = ["src"]
